<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>GreenChat — alertes</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .alert { min-width: 520px; max-width: 900px; text-align: center; color: #fff; background: rgba(12,14,18,.88); border: 3px solid var(--c, #2ee59d);
           border-radius: 22px; padding: 26px 40px; box-shadow: 0 0 40px color-mix(in srgb, var(--c, #2ee59d) 50%, transparent);
           animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
  .alert.out { animation: out .5s forwards; }
  .icon { font-size: 70px; line-height: 1; animation: bounce 1.2s infinite; }
  .label { text-transform: uppercase; letter-spacing: 4px; font-weight: 800; color: var(--c, #2ee59d); margin: 10px 0 4px; font-size: 20px; }
  .text { font-size: 34px; line-height: 1.3; }
  .text b { color: var(--c, #2ee59d); }
  .sub { margin-top: 12px; font-size: 24px; opacity: .9; }
  .emote { height: 1.4em; vertical-align: middle; }
  @keyframes pop { from { transform: scale(.3) translateY(80px); opacity: 0; } }
  @keyframes out { to { transform: scale(.8) translateY(-60px); opacity: 0; } }
  @keyframes bounce { 50% { transform: translateY(-10px) rotate(-6deg); } }
</style>
<link rel="stylesheet" href="/css/overlay-custom.css">
</head>
<body>
<div id="stage"></div>
<script src="/js/common.js"></script>
<script>
(() => {
  const P = GC.params();
  const COLORS = { follow: '#2ee59d', sub: '#9147ff', subgift: '#c56cf0', raid: '#ff6b6b', reward: '#00c8af', cheer: '#f0a920' };
  const NOTES = { follow: [784, 1047], sub: [523, 659, 784, 1047], subgift: [523, 659, 784, 1047, 1319], raid: [392, 523, 659, 784], reward: [880, 1175], cheer: [1047, 1319, 1568] };
  let cfg = {}; let emotes = Object.create(null); let ready = false;
  const queue = []; let busy = false;
  const stage = document.getElementById('stage');

  function enqueue(it) {
    let kind = it.type === 'chat' ? (it.bits > 0 ? 'cheer' : null) : it.kind;
    if (!kind || !COLORS[kind] || !cfg[kind]) return;
    queue.push({ ...it, kind });
    next();
  }
  function next() {
    if (busy || !queue.length) return;
    busy = true;
    const it = queue.shift();
    const el = document.createElement('div');
    el.className = 'alert'; el.style.setProperty('--c', COLORS[it.kind]);
    let info;
    if (it.kind === 'cheer') info = { icon: '🔷', label: 'Bits', html: `<b>${GC.esc(it.user?.name)}</b> envoie <b>${it.bits}</b> bits !` };
    else info = GC.eventInfo(it);
    const msg = it.text ? `<div class="sub">${GC.renderText(it.text, it.emotes, { emotes })}</div>` : '';
    el.innerHTML = `<div class="icon">${info.icon}</div><div class="label">${info.label}</div><div class="text">${info.html}</div>${msg}`;
    stage.appendChild(el);
    if (cfg.sound) GC.ding(Math.min(1, Math.max(0, Number(cfg.volume) || 0.5)), NOTES[it.kind]);
    const dur = Math.max(2, Number(cfg.duration) || 6) * 1000;
    setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); busy = false; next(); }, 500); }, dur);
  }

  GC.connect((m) => {
    if (m.type === 'init') {
      cfg = m.settings.alerts; emotes = GC.toMap(m.emotes); ready = true;
      if (P.preview) { cfg = { ...cfg, sound: false, duration: 3600 }; enqueue({ type: 'event', kind: 'follow', user: { name: 'Viewer_Test' } }); }
    } else if (m.type === 'settings') { if (!P.preview) cfg = m.settings.alerts; }
    else if (m.type === 'emotes') emotes = GC.toMap(m.emotes);
    // chat partagé : pas d'alerte pour les abos / bits / raids reçus par les chaînes partenaires
    else if (ready && !P.preview && !m.source && (m.type === 'event' || (m.type === 'chat' && m.bits > 0))) enqueue(m);
  });
})();
</script>
</body>
</html>

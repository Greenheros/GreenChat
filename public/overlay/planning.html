<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>GreenChat — planning</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  :root { --accent: #2ee59d; font-size: 1vw; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 3rem 4rem; gap: 2rem; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 2rem; }
  h1 { margin: 0; font-size: 4rem; font-weight: 900; letter-spacing: -0.05rem; text-shadow: 0 .3rem 1.5rem rgba(0,0,0,.6); }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 1.6rem; opacity: .85; margin-top: .3rem; }
  .status { background: rgba(12,14,18,.85); border: .2rem solid var(--accent); border-radius: 1.2rem; padding: 1rem 1.8rem; font-size: 1.5rem; text-align: right; }
  .status b { color: var(--accent); font-size: 2rem; display: block; }
  .status.live { border-color: #e91916; }
  .status.live b { color: #ff4d4d; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1rem; }
  .day { background: rgba(12,14,18,.82); border-radius: 1.2rem; padding: 1.2rem; min-height: 16rem; display: flex; flex-direction: column; gap: .8rem; border: .15rem solid rgba(255,255,255,.08); }
  .day.today { border-color: var(--accent); box-shadow: 0 0 2rem color-mix(in srgb, var(--accent) 40%, transparent); }
  .day.past { opacity: .5; }
  .dname { font-size: 1.7rem; font-weight: 800; text-transform: uppercase; }
  .ddate { font-size: 1.1rem; opacity: .7; margin-top: -.6rem; }
  .s { border-left: .4rem solid var(--c, var(--accent)); background: rgba(255,255,255,.06); border-radius: .6rem; padding: .7rem .9rem; }
  .s .t { white-space: nowrap; font-size: 1.3rem; font-weight: 800; color: var(--c, var(--accent)); }
  .s .ti { font-size: 1.3rem; font-weight: 600; margin-top: .2rem; }
  .s .g { font-size: 1.1rem; opacity: .8; margin-top: .2rem; }
  .s.special { background: color-mix(in srgb, var(--c, var(--accent)) 18%, transparent); }
  .off { margin-top: auto; margin-bottom: auto; text-align: center; font-size: 1.4rem; opacity: .55; font-style: italic; }
  .off.cancel { color: #ff6b6b; opacity: .9; }
  /* Variante bandeau : ?layout=compact */
  body.compact :root, body.compact { font-size: 1vw; }
  body.compact .wrap { flex-direction: row; align-items: stretch; padding: 1rem; gap: 1rem; }
  body.compact header { flex-direction: column; align-items: flex-start; justify-content: center; min-width: 16rem; }
  body.compact h1 { font-size: 2.4rem; }
  body.compact .subtitle { font-size: 1.1rem; }
  body.compact .status { font-size: 1rem; padding: .6rem 1rem; text-align: left; }
  body.compact .status b { font-size: 1.3rem; }
  body.compact .days { flex: 1; }
  body.compact .day { min-height: 0; padding: .7rem; gap: .4rem; }
  body.compact .dname { font-size: 1.2rem; }
  body.compact .ddate { font-size: .9rem; margin-top: -.3rem; }
  body.compact .s { padding: .3rem .5rem; }
  body.compact .s .t { font-size: 1.1rem; }
  body.compact .s .ti { font-size: .95rem; }
  body.compact .s .g { display: none; }
  body.compact .off { font-size: 1rem; }
</style>
<link rel="stylesheet" href="/css/overlay-custom.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title"></h1><div class="subtitle" id="subtitle"></div></div>
    <div class="status" id="status"></div>
  </header>
  <div class="days" id="days"></div>
</div>
<script src="/js/common.js"></script>
<script>
(() => {
  const P = GC.params();
  if (P.layout === 'compact') document.body.classList.add('compact');
  let plan = null;
  const E = GC.esc;

  function render() {
    if (!plan) return;
    document.documentElement.style.setProperty('--accent', plan.accent || '#2ee59d');
    const words = (plan.title || 'Planning').split(' ');
    document.getElementById('title').innerHTML = words.length > 1 ? E(words.slice(0, -1).join(' ')) + ' <span>' + E(words.at(-1)) + '</span>' : '<span>' + E(words[0]) + '</span>';
    document.getElementById('subtitle').textContent = plan.subtitle || '';
    const now = new Date();
    const ws = GC.weekStart(now);
    const todayIso = GC.isoDate(now);
    let html = '';
    for (let i = 0; i < 7; i++) {
      const d = new Date(ws); d.setDate(d.getDate() + i);
      const iso = GC.isoDate(d);
      const { items, cancelled, cancelNote } = GC.streamsForDate(plan, d);
      const cls = iso === todayIso ? 'today' : iso < todayIso ? 'past' : '';
      html += `<div class="day ${cls}"><div class="dname">${GC.DAYS[i]}</div><div class="ddate">${d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long' })}</div>`;
      if (!items.length) html += cancelled ? `<div class="off cancel">❌ ${E(cancelNote || 'Pas de live')}</div>` : `<div class="off">${E(plan.offLabel || 'Repos')}</div>`;
      items.forEach((s) => {
        html += `<div class="s ${s.special ? 'special' : ''}" ${s.color ? `style="--c:${E(s.color)}"` : ''}>
          <div class="t">${GC.fmtTime(s.start)}${s.end ? ' – ' + GC.fmtTime(s.end) : ''}</div>
          ${s.title ? `<div class="ti">${s.special ? '⭐ ' : ''}${E(s.title)}</div>` : ''}
          ${s.game ? `<div class="g">🎮 ${E(s.game)}</div>` : ''}${s.guest ? `<div class="g">🤝 avec ${E(s.guest)}</div>` : ''}</div>`;
      });
      html += '</div>';
    }
    document.getElementById('days').innerHTML = html;
    const { live, next } = GC.upcoming(plan, now);
    const st = document.getElementById('status');
    if (live) { st.className = 'status live'; st.innerHTML = `<b>🔴 EN LIVE</b>${E(live.slot.title || live.slot.game || '')}`; }
    else if (next) {
      st.className = 'status';
      const dayName = GC.isoDate(next.start) === todayIso ? 'Ce soir' : GC.DAYS[GC.dayIndex(next.start) - 1];
      st.innerHTML = `Prochain live : ${dayName} ${GC.fmtTime(next.slot.start)}<b>dans ${GC.countdown(next.start - now)}</b>`;
    } else { st.className = 'status'; st.textContent = 'Pas de live prévu'; }
  }

  GC.connect((m) => {
    if (m.type === 'init' || m.type === 'planning') { plan = m.planning; render(); }
  });
  setInterval(render, 30000);
})();
</script>
</body>
</html>
